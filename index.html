<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026 UI/UX Design Trends – Promotional Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #4b0082, #2a0a5e, #1a0033);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .banner {
      position: relative;
      width: 100%;
      max-width: 1400px;
      height: 80vh;
      max-height: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    .title {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(3.5rem, 8vw, 7rem);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #c084fc, #a855f7, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.6);
      z-index: 10;
      white-space: nowrap;
    }

    .subtitle {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      opacity: 0.9;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      z-index: 10;
    }

    .phones {
      position: relative;
      display: flex;
      gap: 120px;
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateY(0deg);
    }

    .phone {
      position: relative;
      width: 380px;
      height: 760px;
      background: linear-gradient(145deg, #111, #1a1a2e);
      border-radius: 60px;
      padding: 14px;
      box-shadow: 
        0 60px 120px rgba(0,0,0,0.7),
        inset 0 0 40px rgba(168,85,247,0.15),
        0 0 80px rgba(168,85,247,0.25);
      border: 2px solid rgba(168,85,247,0.3);
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    .phone:hover {
      transform: translateY(-30px) rotateY(10deg) scale(1.05);
    }

    .phone.left  { transform: rotateY(-18deg) rotateX(5deg); }
    .phone.right { transform: rotateY(18deg) rotateX(5deg); }

    .screen {
      width: 100%;
      height: 100%;
      background: #0f0f1a;
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    /* Glowing accents around phones */
    .phone::before {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle at 50% 50%, rgba(168,85,247,0.4), transparent 60%);
      border-radius: 80px;
      z-index: -1;
      filter: blur(40px);
      opacity: 0.7;
    }

    /* Left phone - Login screen */
    .login {
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      height: 100%;
    }

    .avatar {
      width: 110px;
      height: 110px;
      background: linear-gradient(145deg, #7e22ce, #a855f7);
      border-radius: 50%;
      margin-bottom: 10px;
      box-shadow: 0 0 30px rgba(168,85,247,0.5);
    }

    .input {
      width: 100%;
      padding: 18px 20px;
      border: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      font-size: 1.1rem;
      box-shadow: 
        inset 4px 4px 10px rgba(0,0,0,0.4),
        inset -4px -4px 10px rgba(255,255,255,0.05);
      transition: all 0.3s;
    }

    .input:focus {
      outline: none;
      box-shadow: 
        0 0 0 3px rgba(168,85,247,0.6),
        inset 4px 4px 10px rgba(0,0,0,0.4);
    }

    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #a855f7, #d946ef);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(168,85,247,0.5);
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(168,85,247,0.6);
    }

    .signup {
      color: #c084fc;
      font-size: 1rem;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Right phone - E-commerce */
    .product {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }

    .prod-img {
      width: 100%;
      height: 280px;
      background: linear-gradient(145deg, #6b21a8, #9333ea);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .prod-title {
      font-size: 2.1rem;
      font-weight: 800;
    }

    .price {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(90deg, #c084fc, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rating {
      font-size: 1.4rem;
      color: #fbbf24;
    }

    .buy-btn {
      padding: 18px;
      background: linear-gradient(90deg, #a855f7, #d946ef);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(168,85,247,0.5);
      margin-top: auto;
    }

    /* Floating UI elements */
    .float {
      position: absolute;
      background: rgba(168,85,247,0.18);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(168,85,247,0.3);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      color: #e9d5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      pointer-events: none;
      animation: float 7s infinite ease-in-out;
    }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-30px) rotate(4deg); }
    }

    .float:nth-child(1) { width: 180px; height: 50px; top: 15%; left: 8%; animation-delay: 0s; }
    .float:nth-child(2) { width: 70px;  height: 70px; top: 28%; right: 12%; animation-delay: 1.2s; border-radius: 50%; }
    .float:nth-child(3) { width: 60px;  height: 60px; bottom: 22%; left: 18%; animation-delay: 2.4s; }
    .float:nth-child(4) { width: 140px; height: 48px; bottom: 15%; right: 10%; animation-delay: 3.6s; }
    .float:nth-child(5) { width: 90px;  height: 90px; top: 40%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4.8s; border-radius: 50%; }
    .float:nth-child(6) { width: 110px; height: 50px; bottom: 35%; left: 25%; animation-delay: 6s; }

    .glow-line {
      position: absolute;
      width: 2px;
      height: 180px;
      background: linear-gradient(to bottom, transparent, #a855f7, transparent);
      opacity: 0.4;
      filter: blur(2px);
      transform-origin: top;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1 class="title">2026 UI/UX Trends</h1>
    <p class="subtitle">Bold • Vibrant • Futuristic • Playful</p>

    <div class="phones">
      <!-- Left Phone: Login -->
      <div class="phone left">
        <div class="screen">
          <div class="login">
            <div class="avatar"></div>
            <input class="input" placeholder="Username or Email" />
            <input class="input" type="password" placeholder="Password" />
            <button class="btn">Log In</button>
            <button class="btn" style="background: transparent; border: 2px solid #a855f7; margin-top: 8px;">Sign Up</button>
            <p class="signup">Forgot password?</p>
          </div>
        </div>
      </div>

      <!-- Right Phone: E-commerce -->
      <div class="phone right">
        <div class="screen">
          <div class="product">
            <div class="prod-img"></div>
            <h2 class="prod-title">Your Product</h2>
            <div class="price">$999</div>
            <div class="rating">★★★★☆ 4.0</div>
            <button class="buy-btn">Buy Now</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating playful UI elements -->
    <div class="float">Search...</div>
    <div class="float">🔔</div>
    <div class="float">⚙️</div>
    <div class="float">Home</div>
    <div class="float">Profile</div>
    <div class="float">Now Playing</div>

    <!-- Some glowing connection lines (decorative) -->
    <div class="glow-line" style="top:40%; left:30%; transform:rotate(35deg);"></div>
    <div class="glow-line" style="top:55%; left:60%; transform:rotate(-25deg); height:220px;"></div>
  </div>
</body>
</html>
