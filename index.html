<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHADOW VEIL • CLASSIFIED OPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0e;
      color: #e0e0ff;
      font-family: 'Roboto Mono', monospace;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(10,10,14,0.92), rgba(10,10,14,0.92)),
        url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&q=80&w=2000'); /* dark matrix-ish bg - change if you want */
      background-size: cover;
      background-attachment: fixed;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    header {
      padding: 2rem 0;
      border-bottom: 1px solid rgba(0, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,20,0.6);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      background: linear-gradient(90deg, #00ffff, #ff00aa, #00ffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0,255,255,0.6);
    }

    .nav-links a {
      color: #a0a0ff;
      text-decoration: none;
      margin-left: 2.5rem;
      font-size: 1.1rem;
      transition: all 0.3s;
      position: relative;
    }

    .nav-links a:hover {
      color: #00ffff;
      text-shadow: 0 0 12px #00ffff;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -6px;
      left: 0;
      background: #00ffff;
      transition: width 0.4s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      position: relative;
      padding: 4rem 0;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      width: 100%;
    }

    .hero-text {
      z-index: 2;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4.8rem;
      line-height: 1.05;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, #ff00aa, #00ffff, #ff00aa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(255,0,170,0.5);
    }

    .hero h2 {
      font-size: 2.2rem;
      color: #00ffff;
      margin-bottom: 2rem;
      letter-spacing: 6px;
    }

    .status-bar {
      background: rgba(0,0,0,0.5);
      border: 1px solid #00ffff33;
      padding: 1.2rem;
      border-radius: 8px;
      max-width: 420px;
      margin: 2rem 0;
      font-size: 1.1rem;
    }

    .status-item {
      margin: 0.8rem 0;
      display: flex;
      justify-content: space-between;
    }

    .status-label { color: #88aaff; }
    .status-value { color: #ff88cc; font-weight: bold; }

    .btn {
      display: inline-block;
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 1rem 2.5rem;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.4s;
      margin-top: 1.5rem;
      font-family: 'Orbitron', sans-serif;
    }

    .btn:hover {
      background: #00ffff22;
      box-shadow: 0 0 30px #00ffff88;
      transform: translateY(-4px);
    }

    .hero-image {
      position: relative;
      z-index: 1;
    }

    .hero-image img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0,255,255,0.4),
                  inset 0 0 40px rgba(255,0,170,0.2);
      border: 1px solid #00ffff44;
      transition: all 0.6s;
    }

    .hero-image:hover img {
      transform: scale(1.04);
      filter: brightness(1.1) contrast(1.15);
    }

    .glitch {
      position: relative;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #ff00aa;
      animation: glitch-1 3s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: -2px;
      text-shadow: 2px 0 #00ffff;
      animation: glitch-2 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-1 {
      0% { clip: rect(0, 9999px, 0, 0); transform: skew(0.5deg); }
      5% { clip: rect(20px, 9999px, 80px, 0); transform: skew(1deg); }
      10% { clip: rect(50px, 9999px, 120px, 0); }
      /* ... more random keyframes can be added for better glitch */
      100% { clip: rect(0, 9999px, 0, 0); transform: skew(0deg); }
    }

    @keyframes glitch-2 {
      0% { clip: rect(0, 9999px, 0, 0); transform: skew(-0.5deg); }
      5% { clip: rect(30px, 9999px, 90px, 0); }
      /* add more for realism */
    }

    footer {
      text-align: center;
      padding: 3rem 0;
      color: #666688;
      font-size: 0.9rem;
      border-top: 1px solid #00ffff11;
    }

    @media (max-width: 900px) {
      .hero-content {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .hero h1 { font-size: 3.5rem; }
      .hero-image { margin-top: 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <div class="logo">SHADOW VEIL</div>
        <div class="nav-links">
          <a href="#">HOME</a>
          <a href="#">AGENTS</a>
          <a href="#">MISSIONS</a>
          <a href="#">CONTACT</a>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-content">
        
        <div class="hero-text">
          <h1 class="glitch" data-text="PROJECT: SHADOW VEIL">PROJECT: SHADOW VEIL</h1>
          <h2>CLASSIFIED OPERATIONS</h2>
          
          <div class="status-bar">
            <div class="status-item"><span class="status-label">AGENT STATUS:</span> <span class="status-value">ACTIVE</span></div>
            <div class="status-item"><span class="status-label">THREAT LEVEL:</span> <span class="status-value">HIGH</span></div>
            <div class="status-item"><span class="status-label">LOCATION:</span> <span class="status-value">SECURE</span></div>
            <div class="status-item"><span class="status-label">ENCRYPTION:</span> <span class="status-value">AES-512</span></div>
          </div>

          <button class="btn">INITIATE PROTOCOL →</button>
        </div>

        <div class="hero-image">
          <!-- Yahan tum apni original image daal do (upload karke link ya local file) -->
          <img src="IMG-20260228-WA0000.jpg" alt="Shadow Veil Agents">
          <!-- Agar original image upload karna chahte ho toh catbox.moe / imgur pe daal ke link yahan replace kar dena -->
        </div>

      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 SHADOW OPS | ENCRYPTED CONNECTION | v2.1</p>
  </footer>

</body>
</html>
